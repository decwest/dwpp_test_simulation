# Fig. 1 filming preset, 2026-10-21. Separate from the scored experiment settings.
# Panel order: (a), (c), (b), (d). DWVP is the implementation name of EC-DWVP.
schema_version: 3
common:
  control_frequency_hz: 30.0
  lookahead_time: 0.75
  min_lookahead_dist: 0.11
  max_lookahead_dist: 0.33
  max_velocity: [0.22, 0.22, 0.6]
  min_velocity: [-0.22, -0.22, -0.6]
  max_accel: [0.22, 0.22, 0.6]
  max_decel: [-0.22, -0.22, -0.6]
  pp_translation_speed: 0.22
  # Regulation cap, distinct from the desired VP translational speed below.
  omni_regulation_speed: 0.32
  vp_translation_speed: 0.22
trial:
  xy_tolerance_m: 0.1
  yaw_tolerance_rad: 0.3
  timeout_s: 120.0
conditions:
  # (a): actual Clipped VP, without lateral compensation.
  E1_lateral:
    evaluation: {start_m: 0.0, goal_margin_m: 0.6}
    methods: [VP_CLIP]
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: [0.0, 0.5, 0.0]
    controller_overrides:
      VP_CLIP:
        min_lookahead_dist: 0.33
        max_lookahead_dist: 0.33
        lookahead_dist: 0.33
        lateral_time_constant: 0.0
        use_dynamic_window_vector_pursuit: false
        velocity_feedback: OPEN_LOOP
  # (c): same path and limits as (a), with the designed lateral time constant.
  E1_response_L0p33_T0p5:
    evaluation: {start_m: 0.0, goal_margin_m: 0.6}
    methods: [DWVP]
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: [0.0, 0.5, 0.0]
    controller_overrides:
      DWVP:
        min_lookahead_dist: 0.33
        max_lookahead_dist: 0.33
        lookahead_dist: 0.33
        lateral_time_constant: 0.5
        use_dynamic_window_vector_pursuit: true
        velocity_feedback: OPEN_LOOP
  # (b), (d): the Experiment 1b limits 0.055, 0.055 m/s^2 and 0.15 rad/s^2.
  # The existing condition name is retained for the recorder and metric tools.
  E1_orientation_quarter:
    evaluation: {start_m: 0.0, goal_margin_m: 0.6}
    methods: [VP_CLIP, DWVP]
    acceleration_scale: 0.25
    length_m: 2.5
    spacing_m: 0.01
    orientation_start_m: 1.0
    orientation_length_m: 0.3
    goal_yaw_rad: 1.5707963267948966
    start_pose: [0.0, 0.0, 0.0]
    controller_overrides:
      VP_CLIP:
        lateral_time_constant: 0.0
        use_dynamic_window_vector_pursuit: false
        velocity_feedback: OPEN_LOOP
      DWVP:
        lateral_time_constant: 0.0
        use_dynamic_window_vector_pursuit: true
        velocity_feedback: OPEN_LOOP
metrics:
  lateral_deadband_m: 0.01
  lateral_convergence_ratio: 0.1
  obstacle_near_range_m: 0.6
  robot_radius_m: 0.22
  maximum_source_age_s: 0.2
  maximum_unknown_command_pct: 5.0
surveyed_obstacles: []
