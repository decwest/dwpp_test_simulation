# Physical Experiment 2 session (2026-10-14): route graph v4, VP_CLIP / DWVP / MPPI, 5 forward repeats.
# Derived from dwvp_access_e2_route_design_v4.yaml: same shared settings (local costmap 0.01 m, inflation 0.3 m),
# DWB removed from the scored methods (its setting is still under study; a later DWB-only session reuses these shared settings).
schema_version: 4
common:
  control_frequency_hz: 30.0
  lookahead_time: 0.75
  min_lookahead_dist: 0.11
  max_lookahead_dist: 0.33
  max_velocity:
  - 0.22
  - 0.22
  - 0.6
  min_velocity:
  - -0.22
  - -0.22
  - -0.6
  max_accel:
  - 0.22
  - 0.22
  - 0.6
  max_decel:
  - -0.22
  - -0.22
  - -0.6
  pp_translation_speed: 0.22
  omni_regulation_speed: 0.32
  vp_translation_speed: 0.0
trial:
  xy_tolerance_m: 0.1
  yaw_tolerance_rad: 0.3
  timeout_s: 120.0
conditions:
  E1_lateral:
    evaluation: &id001
      start_m: 0.0
      goal_margin_m: 0.6
    methods:
    - DWPP
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: &id002
    - 0.0
    - 0.5
    - 0.0
  E1_response_L0p11_T0p5:
    evaluation: *id001
    methods:
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: *id002
    controller_overrides:
      DWVP:
        min_lookahead_dist: 0.11
        max_lookahead_dist: 0.11
        lateral_time_constant: 0.5
  E1_response_L0p11_T1p5:
    evaluation: *id001
    methods:
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: *id002
    controller_overrides:
      DWVP:
        min_lookahead_dist: 0.11
        max_lookahead_dist: 0.11
        lateral_time_constant: 1.5
  E1_response_L0p33_T0p5:
    evaluation: *id001
    methods:
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: *id002
    controller_overrides:
      DWVP:
        min_lookahead_dist: 0.33
        max_lookahead_dist: 0.33
        lateral_time_constant: 0.5
  E1_response_L0p33_T1p5:
    evaluation: *id001
    methods:
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    start_pose: *id002
    controller_overrides:
      DWVP:
        min_lookahead_dist: 0.33
        max_lookahead_dist: 0.33
        lateral_time_constant: 1.5
  E1_orientation_nominal:
    evaluation: &id003
      start_m: 0.0
      goal_margin_m: 0.6
    methods: &id004
    - VP_CLIP
    - VP_SCALED
    - DWVP
    acceleration_scale: 1.0
    length_m: 2.5
    spacing_m: 0.01
    orientation_start_m: 1.0
    orientation_length_m: 0.3
    goal_yaw_rad: 1.5707963267948966
    start_pose: &id005
    - 0.0
    - 0.0
    - 0.0
  E1_orientation_half:
    evaluation: *id003
    methods: *id004
    acceleration_scale: 0.5
    length_m: 2.5
    spacing_m: 0.01
    orientation_start_m: 1.0
    orientation_length_m: 0.3
    goal_yaw_rad: 1.5707963267948966
    start_pose: *id005
  E1_orientation_quarter:
    evaluation: *id003
    methods: *id004
    acceleration_scale: 0.25
    length_m: 2.5
    spacing_m: 0.01
    orientation_start_m: 1.0
    orientation_length_m: 0.3
    goal_yaw_rad: 1.5707963267948966
    start_pose: *id005
  E2_environment:
    evaluation:
      start_m: 0.0
      goal_margin_m: 0.6
    methods:
    - VP_CLIP
    - DWVP
    - MPPI
    acceleration_scale: 1.0
    start_pose: null
    controller_overrides:
      DWVP:
        use_rotate_to_heading: false
        use_cost_regulated_linear_velocity_scaling: false
        lateral_time_constant: 0.6
        use_velocity_scaled_lookahead_dist: false
        lookahead_dist: 0.11
        min_lookahead_dist: 0.11
        max_lookahead_dist: 0.11
      MPPI:
        PathAlignCritic:
          use_path_orientations: true
          cost_weight: 30.0
        PathAngleCritic:
          cost_weight: 6.0
        time_steps: 60
        model_dt: 0.03333333333333333
        wz_std: 0.2
      VP_CLIP:
        use_rotate_to_heading: false
        use_cost_regulated_linear_velocity_scaling: false
        use_velocity_scaled_lookahead_dist: true
    costmap_inflation_radius_m: 0.3
    local_costmap_resolution_m: 0.01
metrics:
  lateral_deadband_m: 0.01
  lateral_convergence_ratio: 0.1
  obstacle_near_range_m: 0.6
  robot_radius_m: 0.22
  maximum_source_age_s: 0.2
  maximum_unknown_command_pct: 5.0
surveyed_obstacles: []
